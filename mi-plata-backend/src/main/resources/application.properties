spring.application.name=miplata
# La base mi_plata tiene las columnas en camelCase (cuentaID, numeroCuenta...), asi que se respetan tal cual
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Conexion a MySQL/MariaDB (XAMPP): importar primero mi_plata.sql en phpMyAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/mi_plata
spring.datasource.username=root
spring.datasource.password=
# none: no modifica las tablas existentes
spring.jpa.hibernate.ddl-auto=none
# MariaDB no soporta "FOR UPDATE OF": se usa el dialecto de MariaDB para el bloqueo pesimista
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Servidor de reportes en Python (reportes/servidor.py)
python.reportes.url=http://localhost:5000/reporte

# Documentacion Swagger (springdoc)
springdoc.api-docs.enabled=true
spring.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
